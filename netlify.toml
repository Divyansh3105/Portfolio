[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# This is not a SPA: it is a handful of prerendered documents. There is deliberately no
# `/* -> /index.html 200` catch-all, because that answered every unknown URL
# with the homepage under a 200 - a soft 404. Netlify serves dist/404.html
# with a real 404 status for anything unmatched.
[[redirects]]
  from = "/gravlang"
  to = "/gravlang/"
  status = 301

[[redirects]]
  from = "/talkspace"
  to = "/talkspace/"
  status = 301

[[redirects]]
  from = "/playdex"
  to = "/playdex/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Third-party origins, and nothing else is: the EmailJS endpoint the
    # contact form posts to, and Cloudflare Web Analytics - which needs two
    # entries, because the beacon is
    # served from static.cloudflareinsights.com but reports to
    # cloudflareinsights.com/cdn-cgi/rum. Allowing only the script origin lets
    # it load and then silently fail to send anything. The TalkSpace host is
    # in connect-src for one opaque wake-up ping when its dialog opens.
    # 'unsafe-inline' on style-src is required - Tailwind is a stylesheet, but
    # GSAP writes inline `style` attributes on every element it animates.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://api.emailjs.com https://cloudflareinsights.com https://talkspace-i5d2.onrender.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Content-hashed filenames, so they can never go stale.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
