<style>
  /* Loading screen. Lives in the HTML shell, not in React: it has to paint
     before any script has run, and it is dismissed by src/lib/loader.js.
     The base styles are the finished state, so with reduced motion (or no
     animation at all) it is simply a calm static frame. */
  #loader {
    position: fixed;
    inset: 0;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--color-bone, #f4f3f1);
    color: var(--color-ink, #0a0a0a);
    transition: transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    /* Last resort if the script never runs: lift the curtain anyway. */
    animation: loader-failsafe 0.4s 7s forwards;
  }
  #loader.is-done {
    transform: translateY(-100%);
    pointer-events: none;
  }
  html[data-loaded] #loader {
    display: none;
  }
  #loader .loader-thread {
    position: relative;
    width: 1px;
    height: 6rem;
    margin-bottom: 1.5rem;
  }
  #loader .loader-thread::before {
    content: "";
    position: absolute;
    inset: 0;
    background: currentColor;
    opacity: 0.4;
    transform-origin: top;
    animation: loader-grow 1s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  }
  #loader .loader-spider {
    position: absolute;
    left: 50%;
    top: 100%;
    width: 30px;
    height: 30px;
    margin: -4px 0 0 -15px;
    color: var(--color-blood, #c10f1b);
    animation: loader-lower 1s cubic-bezier(0.16, 1, 0.3, 1) backwards,
      loader-bob 2.4s 1s ease-in-out infinite;
  }
  #loader .loader-name {
    margin: 0;
    font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
    font-size: 0.6875rem;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    animation: loader-fade 0.6s 0.25s backwards;
  }
  #loader .loader-name span {
    color: var(--color-blood, #c10f1b);
  }
  #loader .loader-bar {
    position: relative;
    width: 7rem;
    height: 1px;
    margin-top: 1.25rem;
    overflow: hidden;
    background: color-mix(in srgb, currentColor 15%, transparent);
  }
  #loader .loader-bar::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 40%;
    background: var(--color-blood, #c10f1b);
    animation: loader-sweep 1.2s ease-in-out infinite;
  }
  #loader .loader-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  @keyframes loader-grow {
    from { transform: scaleY(0); }
  }
  @keyframes loader-lower {
    from { transform: translateY(-6rem); }
  }
  @keyframes loader-bob {
    50% { transform: translateY(6px); }
  }
  @keyframes loader-fade {
    from { opacity: 0; }
  }
  @keyframes loader-sweep {
    from { transform: translateX(-100%); }
    to { transform: translateX(250%); }
  }
  @keyframes loader-failsafe {
    to { opacity: 0; visibility: hidden; pointer-events: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    #loader,
    #loader * {
      animation: none !important;
    }
    #loader {
      transition: opacity 0.3s;
    }
    #loader.is-done {
      transform: none;
      opacity: 0;
    }
  }
  @media print {
    #loader {
      display: none !important;
    }
  }
</style>
<noscript><style>#loader { display: none; }</style></noscript>
