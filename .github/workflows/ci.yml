name: CI

# The old workflow only deployed, and only on push to main - nothing was ever
# checked before a merge. Netlify owns deployment now, so this just gates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Only Chromium. The suite checks behaviour, not rendering differences
      # between engines, so the other two would be download time for nothing.
      - run: npx playwright install --with-deps chromium

      # `npm test` builds first - the build-output and browser tests both
      # assert against dist/ - so there is no separate build step to run.
      - run: npm test
